<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171c">
  <title>株マーケット</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 id="title">株マーケット</h1>
      <div class="top-actions">
        <button id="reload" class="icon-btn" aria-label="最新のデータを読み込む">↻</button>
        <button id="open-settings" class="icon-btn" aria-label="設定">⚙</button>
      </div>
    </div>
    <div id="updated" class="updated"></div>
  </header>

  <section id="notices" class="notices" hidden></section>

  <main>
    <section id="tab-morning" class="tab" hidden></section>
    <section id="tab-evening" class="tab" hidden></section>
    <section id="tab-attention" class="tab" hidden></section>
    <section id="tab-schedule" class="tab" hidden></section>
  </main>

  <nav class="tabbar">
    <button data-tab="morning">朝</button>
    <button data-tab="evening">夜</button>
    <button data-tab="attention">注目</button>
    <button data-tab="schedule">予定</button>
  </nav>

  <dialog id="settings">
    <form method="dialog" class="settings-body">
      <h2>データを読む鍵</h2>
      <p>GitHub で作った「読み取り専用の鍵」(github_pat_ で始まる文字列)を貼り付けてください。鍵はこのスマホの中だけに保存されます。</p>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_...">
      <p id="token-status" class="muted"></p>
      <div class="settings-actions">
        <button value="cancel" class="secondary">閉じる</button>
        <button id="save-token" value="save">保存して読み込む</button>
      </div>
    </form>
  </dialog>

  <dialog id="chart" class="sheet">
    <div class="sheet-head">
      <button id="chart-back" class="icon-btn" aria-label="戻る" hidden>←</button>
      <h2 id="chart-title"></h2>
      <button id="chart-close" class="icon-btn" aria-label="閉じる">✕</button>
    </div>
    <div id="chart-body" class="sheet-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
